<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="一款文字版修仙放置游戏。玄之又玄 · 众妙之门。" />
    <!-- theme-color 由 src/core/theme.ts 在启动与主题切换时动态同步(亮/暗各一色) -->
    <meta name="theme-color" content="#F3EFE4" />
    <meta name="keywords" content="玄枢录,玄枢,修仙,修仙游戏,文字游戏,文字修仙,放置修仙,放置游戏" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="玄枢录" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="玄枢录 — 玄之又玄 · 众妙之门" />
    <meta property="og:description" content="文字版修仙放置游戏" />
    <link rel="icon" href="./favicon.ico" />
    <!-- PWA「添加到主屏幕」:manifest 提供独立图标/全屏/启动画面(ISS-171) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>玄枢录</title>
  </head>

  <body>
    <!--
      首帧占位:Vue 挂载时会整块替换 #app 的内容,这一块只在"脚本还没到位"的那一瞬间可见
      —— 冷启动、首次装 PWA、慢网络、离线首开。那几百毫秒里玩家看到的不该是一张空白宣纸,
      而是本作的名与印(与欢迎页同一副字、同一枚朱砂印)。
      顺带兜一层底:脚本真挂了(解析失败、老浏览器不认模块),这页也不会是空白。

      样式只能内联在这里:此刻还没有 CSS。颜色是色板的手抄值(见 palette.spec.ts 的
      「两处手抄关系」那条,index.html 也算一处),暗色另给一套,按系统偏好先兜住一半
      的闪白(玩家自己选的「夜间」存在存档里,首帧读不到)。
    -->
    <div id="app">
      <div class="boot">
        <span class="boot-seal">道</span>
        <p class="boot-title">玄枢录</p>
        <p class="boot-sub">玄之又玄 · 众妙之门</p>
      </div>
    </div>
    <style>
      #app {
        --boot-paper: 243 239 228;
        --boot-ink: 41 39 34;
        --boot-cinnabar: 168 63 57;
      }
      @media (prefers-color-scheme: dark) {
        #app {
          --boot-paper: 33 31 28;
          --boot-ink: 232 226 210;
          --boot-cinnabar: 255 119 115;
        }
      }
      #app .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        background: rgb(var(--boot-paper));
        font-family: 'Kaiti SC', STKaiti, KaiTi, 'Noto Serif SC', serif;
      }
      #app .boot-seal {
        display: grid;
        place-items: center;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 0.75rem;
        background: rgb(var(--boot-cinnabar));
        color: rgb(var(--boot-paper));
        font-size: 2.6rem;
        line-height: 1;
      }
      #app .boot-title {
        margin: 1rem 0 0;
        color: rgb(var(--boot-ink));
        font-size: 2.1rem;
        letter-spacing: 0.3em;
      }
      #app .boot-sub {
        margin: 0;
        color: rgb(var(--boot-ink));
        opacity: 0.62;
        font-size: 0.75rem;
        letter-spacing: 0.4em;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
    <!--
      这里**不挂任何外部统计** —— 页面不加载外部脚本、不发任何外部请求,
      断网与联网的表现完全一致(隐私声明第六节那句"不接入任何第三方服务"因此是硬承诺)。

      想知道使用情况就走**本地**:stores/pacingTelemetry 与 core/progress 的计数器都在存档里,
      不上传、不联网;真要发出去,那是使用者自己的决定,不该由默认配置替他们做。
    -->
  </body>

</html>

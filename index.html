<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="一款文字版修仙放置游戏。玄之又玄 · 众妙之门。" />
    <!-- theme-color 由 src/core/theme.ts 在启动与主题切换时动态同步(亮/暗各一色) -->
    <meta name="theme-color" content="#F3EFE4" />
    <meta name="keywords" content="玄枢录,玄枢,修仙,修仙游戏,文字游戏,文字修仙,放置修仙,放置游戏" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="玄枢录" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="玄枢录 — 玄之又玄 · 众妙之门" />
    <meta property="og:description" content="文字版修仙放置游戏" />
    <link rel="icon" href="./favicon.ico" />
    <!-- PWA「添加到主屏幕」:manifest 提供独立图标/全屏/启动画面(ISS-171) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>玄枢录</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!--
      统计代码勿删 —— 但**不许挡住游戏**。

      它原本是一条普通 <script>:解析器要停下等它下载并执行完,才轮到后面的模块脚本,
      也就是「统计脚本多久回来,首屏就晚多久」(实测脚本卡 1200ms,界面 1294ms 才出现;
      弱网或劫持下没有上限)。改成 defer 后它退到文档解析之后、与游戏模块脚本并行下载,
      恰好在 DOMContentLoaded 之前执行完。

      下面这句因此不能再裸写 LA.init:离线(Service Worker 只兜自家资源,跨域一律不干预)
      或被广告拦截时,脚本压根不存在,裸写会抛未捕获的 ReferenceError —— 每次离线冷启动
      都抛一次。defer 脚本必定先于 DOMContentLoaded 跑完,所以在这里等 DOMContentLoaded
      再初始化;取不到就静默,统计丢了不要紧,游戏照常。
    -->
    <script defer charset="UTF-8" id="LA_COLLECT" src="https://sdk.51.la/js-sdk-pro.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        window.LA?.init({ id: 'LIx18788ryPZohY4', ck: 'LIx18788ryPZohY4', autoTrack: true, hashMode: true })
      })
    </script>
  </body>

</html>

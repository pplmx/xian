name: "安装依赖 (Vite+ 工具链)"
description: "检出 + setup-vp + 冻结安装 —— 四个 workflow 里重复九次的三件套,收口成一处"

# 这三步在 gate / deploy / build / publish 的每个 job 里原样出现(仅注释深浅不一):
#   checkout → setup-vp(版本三源:Node 24 · Bun 按 packageManager · Vite+ 按 lockfile)
#   → vp install --frozen-lockfile。
# 收口成 composite action 的动机与 gate.yml 相同:同一套接线抄九遍,改一处漏八处。
# 各 job 特有的缓存(bun store / tsbuildinfo / .vite / playwright / electron)依赖
# hashFiles 表达式 —— composite action 里不可用,故仍留在各 workflow 原位。
#
# inputs:
#   run-install —— gate.yml 置 false:它的「缓存 bun install」必须先于 install 恢复
#   (装依赖时才能命中),收口不能把这条顺序也吞进去;其余 job 用默认 true。
#
# 【本 action 不含 checkout】本地 composite(`uses: ./…`)必须先 actions/checkout
# 才能被引用 —— runner 是从工作区里找 action.yml 的,而工作区要 checkout 才存在,
# 「composite 第一步自己 checkout」是鸡生蛋(CI 实测报错:Can't find 'action.yml'
# under '.github/actions/setup-vp-install')。故检出由各 job 在引用本 action 前
# 显式做一步,代价是每 job 多一行,换九处接线单点维护。
inputs:
  run-install:
    description: "装完工具链后是否顺带 vp install --frozen-lockfile"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: 设置 Vite+ (Node 24 · Bun 按 packageManager · Vite+ 按 lockfile)
      uses: voidzero-dev/setup-vp@v1.21.1
      with:
        version-file: package.json
        node-version: "24"
        cache: true
        run-install: false

    - name: 安装依赖 (frozen)
      if: inputs.run-install == 'true'
      shell: bash
      run: vp install --frozen-lockfile

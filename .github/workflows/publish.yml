name: 构建并发布 Docker 镜像

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # 镜像名跟随仓库,不写死。此前写死成 yunyin-xiuxian:仓库改名或换 owner 后
      # (yunyin-xiuxian → xian),这一步仍拿新仓库的 GITHUB_TOKEN 去写旧仓库名下
      # 的软件包,ghcr 回 permission_denied: write_package —— 前面全绿,卡在最后
      # 一推。GHCR 路径是 ghcr.io/<owner>/<repo>,Docker Hub 用仓库短名。
      # (ghcr 只收小写路径;本仓库 owner/name 都是小写,换名时留意别带大写。)
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_NAME: ${{ github.event.repository.name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 缓存 bun 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 静态检查 + 单元测试
        run: |
          bun run check
          # test:report = 一次完整 vitest 运行 + 分类报告 + 文档例数核对(见 scripts/test-report.mjs)
          bun run test:report
          # 公共库的发布产物自检(见 scripts/engine-dist.mjs)
          bun run check:engine
          bun run check:engine:standalone

      # 镜像是要发出去的,故走发布路径(带 legacy 兜底);日常构建不打 legacy,
      # 老内核的玩家会白屏。见 vite.config.ts 的 XIAN_LEGACY 与 docs/development.md。
      - name: 构建项目(发布路径:带 legacy 兜底)· 带时长上限
        run: bun scripts/build-timed.mjs --release

      - name: 核 legacy 与现代化两份产物
        run: bun run check:legacy

      - name: 验证构建产物
        run: |
          if [ ! -d "dist" ]; then
            echo "构建失败：dist 目录不存在"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "构建失败：dist/index.html 不存在"
            exit 1
          fi
          # 实质校验:挂载点与入口脚本就位,才算一份能跑的产物(旧的 mtime 判据在 CI 永不命中,已删)
          grep -q 'id="app"' dist/index.html || { echo "构建失败：index.html 缺少 #app 挂载点"; exit 1; }
          grep -q 'src=.*main' dist/index.html || grep -q 'assets/' dist/index.html || { echo "构建失败：index.html 未引用入口脚本"; exit 1; }

          echo "构建产物验证通过"
          ls -la dist/

      - name: 获取当前日期
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "当前版本: $VERSION"

      - name: 准备 CI 构建环境
        run: |
          cp .dockerignore.ci .dockerignore
          echo "已切换到 CI 构建模式"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 登录 GHCR（始终执行）
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录 Docker Hub（仅在配置了用户名时执行）
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: false
          pull: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME && format('{0}/{1}:latest', env.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
            ${{ env.DOCKERHUB_USERNAME && format('{0}/{1}:{2}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME, steps.version.outputs.version) || '' }}
            ${{ env.DOCKERHUB_USERNAME && format('{0}/{1}:{2}', env.DOCKERHUB_USERNAME, env.IMAGE_NAME, github.sha) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.date }}
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=玄枢录
            org.opencontainers.image.description=玄枢录 - 一款修仙放置游戏
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}

name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 静态门禁单独跑一次(gate.yml 可复用工作流):check + test + build + engine + standalone,
  # 与发布/构建各自的 job 解耦 —— 不再在每个 job 里各自内联一遍整套判据。
  gate:
    uses: ./.github/workflows/gate.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    # 与 build.yml 的 ui-check 同一档余量:全 job 实测 ~20 分钟(冒烟 ~14 分钟是大头),
    # 原先没写 timeout —— 没有上限的 job 卡死时会挂到平台来收尸。
    timeout-minutes: 40
    steps:
      # 工具链 + 依赖收口在 ./.github/actions/setup-vp-install(全仓九处同一段接线);
      # 检出单独一步 —— 本地 composite 要先 checkout 才能被引用
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 工具链 + 依赖
        uses: ./.github/actions/setup-vp-install
      # 浏览器自检(构建计时 + 六门)与 build.yml 的 ui-check 共用一份接线:
      # ./.github/actions/ui-self-check —— 排版/首屏/运行时/冒烟/离线顺序只此一处定义。
      # playwright 缓存留在这一层(key 要 hashFiles 表达式,composite action 内不可用)。
      - name: 缓存浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: 浏览器自检(构建计时 + 六门)
        uses: ./.github/actions/ui-self-check
      # 前置条件:仓库需在 Settings → Pages → Build and deployment 里把 Source 选成
      # GitHub Actions。configure-pages 拿不到站点就会直接失败(Not Found)。
      # 不要改用 enablement: true 绕过:该参数要求非 GITHUB_TOKEN 的凭据
      # (PAT 的 repo 权限或 GitHub App 的 administration:write + pages:write)。
      - name: 配置 Pages
        uses: actions/configure-pages@v6
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v5

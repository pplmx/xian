name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 静态检查 + 单元测试
        run: |
          bun run check
          bun run test
          # 公共库的发布产物也要自检:用例跑的是 src,这一条跑的是 dist ——
          # 空壳产物/漏文件/导出对不上,只会在别人 npm 装下来时才暴露,那时已经晚了
          bun run check:engine
          # 公共库还要"能单独成 repo":整份复制到临时目录,独立编译 + 独立跑用例 + 独立装配
          bun run check:engine:standalone
      # 这一份是**要发到玩家面前**的:故走发布路径(带 legacy 兜底),日常构建
      # (`bun run build`)只给开发与 PR 门用 —— legacy 每次构建要花掉大半个构建时长,
      # 而现代浏览器一个字节都不会请求它。见 vite.config.ts 的 XIAN_LEGACY。
      - name: 构建(发布路径:带 legacy 兜底)
        run: bun run build:release
      - name: 核 legacy 与现代化两份产物
        run: bun run check:legacy
      # 浏览器自检放在**上传产物之前**:排版/触达区/对比度/焦点/弹窗语义/
      # 离屏回放那一整套判据,红一条就不发布这一版(与 build.yml 的 ui-check 同一套)。
      # playwright 锁在 devDependencies 里,浏览器二进制按需下并缓存(与 build.yml 同一步)。
      - name: 缓存浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: 装浏览器
        run: bunx playwright install --with-deps chromium
      - name: 浏览器自检(排版与交互)
        run: bun scripts/layout-check.mjs
      # 首屏预算:冷启动解码字节 / FCP / 楷体换上(见 scripts/first-paint.mjs)
      - name: 首屏预算(冷启动字节 / FCP / 楷体换上)
        run: bun scripts/first-paint.mjs
      # 逐页点按钮的冒烟(点炸了没有 / 有没有 NaN 漏到正文)——与排版自检同一道门的另一半
      - name: 界面冒烟(逐页点按钮)
        run: bun scripts/ui-smoke.mjs
      - name: 离线/发版接管自检
        run: bun scripts/offline-check.mjs
      # 前置条件:仓库需在 Settings → Pages → Build and deployment 里把 Source 选成
      # GitHub Actions。configure-pages 拿不到站点就会直接失败(Not Found)。
      # 不要改用 enablement: true 绕过:该参数要求非 GITHUB_TOKEN 的凭据
      # (PAT 的 repo 权限或 GitHub App 的 administration:write + pages:write)。
      - name: 配置 Pages
        uses: actions/configure-pages@v6
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v5

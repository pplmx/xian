name: 共享静态门禁 (可复用工作流)

# 静态门禁的唯一实现:env + 类型 + 格式(oxfmt) + lint + 文档 + 测试 + 构建。
# 全仓各 workflow(部署 Pages / 发布镜像 / 构建客户端)都用 `uses` 引用它一次,
# 不再各自内联整段「check + test:report + check:engine + standalone」——
# 要改判据只改这一处;一次 push 多个 workflow 同时触发,也只在各自 workflow 里跑一遍。
# 本机 `.vite-hooks/pre-commit` 跑同一套命令:**本地静态门过了,CI 的静态门就过**。
# 但静态门 ≠ 全部门 —— 浏览器门(构建时长 / 首屏 / 帧率 / 排版 / 冒烟 / 离线)不在
# verify 链里(一轮约五分钟,提交前扛不住),只在各 workflow 的 ui-check job 与本地
# `bun run check:ui` 里跑。故「提交前的绿」不等于「CI 全绿」,对那六项尤其如此。
# 这条接线由 `src/core/gateWiring.spec.ts` 守着:CI 里出现的每个 `bun scripts/*.mjs`
# 都得在 package.json 或 verify 里有对等入口,反之 verify 点名的脚本也必须真存在。
#
# 完整判据命令:`vp fmt --check && vp run verify`
#   · vp fmt --check —— 格式(oxfmt,只判不改),补上 CI 此前缺的格式判据
#   · vp run verify  —— 仓库 vite.config.ts 的 verify 任务(cache:false 每次真跑):
#       bun run check(env + 类型 + lint + 文档) + test + test:report +
#       build + check:engine + check:engine:standalone
#
# 运行时 pin:Node 24(与 engines >=24 一致)、Bun 走 packageManager(1.4.3)、
# Vite+ 用 version-file 从 package.json 的 catalog 解到 lockfile 版本(不再手抄,杜绝漂移)。
on:
  workflow_call:

jobs:
  gate:
    name: 静态门禁 (check·test·build·engine)
    runs-on: ubuntu-latest
    # 实测(run 39159016919,缓存全热):全程 ~3 分钟,大头是 verify 里的
    # test + build(~2.5 分钟)。原先的 40 分钟远超实测,超时上限本该是
    # 「实测 × 余量」:取 15 分钟,仍给 5 倍余地兜住引擎两段冷缓存的首跑。
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 —— 不是「顺手多拉点历史」,是**有判据依赖它**。
      #
      # `actions/checkout` 默认只取 1 个提交(浅克隆)。浅克隆里 `.git/shallow` 的
      # graft 边界把历史截断,`git log -1 -- <任意路径>` 一律返回**边界那次提交**的
      # 时间。`src/core/docShotsFresh.spec.ts` 判「文档图有没有比它展示的界面旧」
      # 正是比两侧的 `git log` 时间 —— 浅克隆下两边恒等,于是**无论图多旧都是绿的**。
      #
      # 实测(2026-11-11,同一个提交 60600518 上跑同一条判据):
      #   完整历史克隆        × 红:welcome / codex / world 三张旧于界面
      #   `--depth 1` 浅克隆  ✓ 绿:什么都没查出来
      # 而此前这里没写 fetch-depth,CI 跑的就是后者 —— 这条判据在 CI 上从没真正执行过。
      #
      # 代价:仓库 62 MB,全历史检出实测十几秒(CI 全程约 3 分钟,超时上限 15 分钟)。
      # 想省这点时间而退回浅克隆,`docShotsFresh.spec` 的「判据的前提」会当场红 ——
      # 红得指着原因,而不是假装查过。
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 工具链 + 依赖收口在 ./.github/actions/setup-vp-install(全仓九处同一段接线)。
      # run-install: false —— 下面的「缓存 bun install」必须先于 install 恢复,
      # 装依赖时才能命中;这条顺序不能被收口吞掉。
      # (检出不在 composite 里:本地 action 要先 checkout 才能被引用。)
      - name: 设置工具链
        uses: ./.github/actions/setup-vp-install
        with:
          run-install: "false"

      # —— 缓存:跨 job、跨 run 复用,避免每次重下/重算 ——
      # bun install 缓存要先于 install 恢复,装依赖时才能命中
      - name: 缓存 bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: 安装依赖 (frozen)
        run: vp install --frozen-lockfile

      - name: 缓存 vue-tsc 增量 (tsbuildinfo)
        uses: actions/cache@v6
        with:
          path: |
            **/*.tsbuildinfo
            node_modules/.tmp
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig*.json','packages/**/tsconfig*.json','vite.config.ts') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: 缓存 vitest/vite (node_modules/.vite)
        uses: actions/cache@v6
        with:
          path: node_modules/.vite
          key: vitest-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            vitest-${{ runner.os }}-

      # 完整判据:格式 + check + test + test:report + build + engine + standalone
      # (与 .vite-hooks/pre-commit 跑同一套,见 gate 顶部注释)
      - name: 完整门禁 (vp fmt --check && vp run verify)
        run: |
          vp fmt --check
          vp run verify

      # 打乱用例顺序再跑一遍 —— 常规 `vp run verify` 里的 test 按书写顺序跑,
      # 靠顺序工作的用例(模块级状态没重置、describe 忘了建 pinia)在那里永远绿。
      # 实测这道检查第一次跑就红了 41 条,分散在 7 个文件。固定种子=1,
      # 同一份代码永远同一顺序 —— 红了就是真问题,不是运气。一轮约 40 秒。
      - name: 打乱用例顺序 (抓顺序依赖)
        run: bun run check:shuffle

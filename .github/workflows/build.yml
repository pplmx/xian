name: 构建多平台程序 (Electron & Android)

# 只在推 tag(v1.2.3)时触发。
#
# 原先是挂在 main 的每次 push 上:提交一次就跑一遍两平台构建,并且把同一版本的
# Release 资产「先删后传」—— 于是每个提交都会留下一个 release,谁也没法从发布页
# 看出哪一次才是真正的发版。改成 tag 触发后,发版成了一个显式动作
# (`git push origin v1.2.3`);main 上的每次提交仍由 deploy.yml 过同一道闸
# (类型检查 + ESLint + 单测),闸门没丢,只是不再顺手发版。
on:
  push:
    tags:
      - 'v*.*.*'

# 同一个 tag 只留一条流水线。两个 run 同时进 release job,会在同一个 tag 下
# 「先删旧资产、再传新资产」,互相删掉对方刚传的文件,Release 里就会缺东西。
# 用 cancel-in-progress: false 而不是 true —— 取消进行中的 run,有可能正好
# 砍在「已删完、还没传完」的窗口里,留下一个资产不全的 Release。
# (失败后重跑用 Actions 页面的 Re-run:同一个 tag 的 run 串行,不会互相踩。)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 0. 版本闸门:tag 必须与 package.json 是同一个版本
  #
  # 两处版本号各有各的用处 —— tag 决定 Release 挂在哪个名下,package.json 决定
  # APK 的 versionName/versionCode(android/app/build.gradle 从它读)。两者对不上,
  # 就会出现「Release 页写着 v1.34.0、装到手机上却是 1.33.0」,玩家的升级提示与
  # 实际版本对不起来。宁可在这里红掉,也不要发出一个自相矛盾的版本。
  guard:
    name: 版本闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag = $TAG · package.json = $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag($TAG)与 package.json 的版本($PKG)不一致 —— 先把 package.json 的版本提上去再打 tag"
            exit 1
          fi

  # 浏览器自检 —— 排版/触达区/对比度/焦点/弹窗语义/离屏回放那一整套判据。
  #
  # 从前它只活在"谁记得在本地跑一次"里:scripts/ 没有任何工作流引用,
  # 于是每一个发出去的 APK/安装包都没有 UI 层面的门。
  # 这里单起一个 job:所有构建都 needs 它 —— 判据红,构建与发布都停在这。
  ui-check:
    name: 浏览器自检(排版与交互)
    runs-on: ubuntu-latest
    # 三条自检的时长(本机实测):排版 ~6 分 + 冒烟 ~5 分半 + 离线 ~1 分,另加装依赖与构建。
    # 原先的 20 分钟在只有排版那一条时够用,现在贴得太近 —— 超时会让这道门偶发失败,
    # 而一个会自己变红的门比没有门更糟。故留出余量。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
      # 构建计时:这一步既是「构建产物(自检量的是 dist)」,也顺带把**构建时长**量成判据
      # (现代目标上限 90s)。legacy 一旦被接回日常构建,时长会成倍长回去,这里当场红。
      - name: 构建产物(自检量的是 dist)· 带时长上限
        run: bun scripts/build-timed.mjs
      # playwright 锁在 devDependencies 里(版本真源 = bun.lock,不再手抄进命令)。
      # 它没有 postinstall:bun install 只带 ~19MB 的 JS 本体,占地的浏览器二进制
      # 只由下面这一句按需下,落在 ~/.cache/ms-playwright —— 故给缓存,别每次重下。
      - name: 缓存浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: 装浏览器
        run: bunx playwright install --with-deps chromium
      # 首屏预算:冷启动解码字节 / FCP / 楷体换上,三条各有上限(scripts/first-paint.mjs)。
      # 它自带一个静态服务器与 4G 限速 —— 本机回环上不量不出取舍(字体抢带宽那件事
      # 只在慢网下才发生)。这也是「首屏瘦身」那条工作的门:字体切片掉了、或者哪天
      # 又整份打进来,这里当场红。
      - name: 首屏预算(冷启动字节 / FCP / 楷体换上)
        run: bun scripts/first-paint.mjs
      - name: 排版与交互自检
        run: bun scripts/layout-check.mjs
      # 与排版自检的分工:那边量排版,这边戳交互 —— 逐页把按钮点一遍,看有没有
      # 点炸(pageerror)、有没有 NaN/undefined 漏到正文。它和排版自检同属 ISS-188
      # 里被点名的那两条,但当时只接上了排版与离线;发版门缺的正是这一条。
      - name: 界面冒烟(逐页点按钮)
        run: bun scripts/ui-smoke.mjs
      # Service Worker 只认安全上下文,故离线自检另起一个本地静态服务量同一份产物:
      # 断网可重开、旧缓存会被清、发版能接管(见 scripts/offline-check.mjs)。
      - name: 离线/发版接管自检
        run: bun scripts/offline-check.mjs

  # 发布产物:legacy 那一套还出得来吗
  #
  # legacy(Chrome 51 / Android 7 的兜底)从「每次构建都打」改成「只在发布路径上打」:
  # vite.config 的 XIAN_LEGACY=1,由 `bun run build:release` 带上。日常构建与上面那道
  # ui-check 门因此都看不到它 —— 万一那个开关坏了、插件升级换了注入方式,日常的门全是
  # 绿的,直到老内核的玩家打开是一片白屏。故这里**真打一次发布产物**再核一遍
  # (nomodule 兜底、SystemJS 装载、每页都有 legacy 那一份)。
  legacy-artifacts:
    name: 发布产物(legacy 兜底)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 打发布产物(XIAN_LEGACY=1)· 带时长上限
        run: bun scripts/build-timed.mjs --release
      - name: 核 legacy 与现代化两份产物
        run: bun run check:legacy

  # 1. 构建 Electron 客户端
  build-electron:
    name: 构建 Electron (${{ matrix.os }})
    needs: [guard, ui-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 过闸才继续:lint/类型检查/单测任意一条红,构建与发布都停在这
      - name: 静态检查 + 单元测试
        run: |
          bun install --frozen-lockfile
          bun run check
          # test:report = 一次完整 vitest 运行 + 分类报告 + 文档例数核对(见 scripts/test-report.mjs);
          # 失败/跳过/未登记分类/文档例数不符都会红,替代裸 `bun run test` 少跑一遍测试
          bun run test:report
          # 公共库的发布产物自检(见 scripts/engine-dist.mjs)
          bun run check:engine
          # 公共库还要"能单独成 repo":整份复制到临时目录,独立编译 + 独立跑用例 + 独立装配
          bun run check:engine:standalone

      - name: 缓存 Electron Builder
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: 构建 Electron
        run: bun run build:electron --${{ matrix.platform }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 【关键点】上传 zip 产物
      - name: 上传 Electron 安装包
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            pkg/*.zip

  # 2. 构建 Android APK
  build-android:
    name: 构建 Android APK
    needs: [guard, ui-check]
    runs-on: ubuntu-latest
    # 签名口令走 Secrets 注入(不落在仓库文件里)。
    #
    # 为什么先落 env 再判空:step 级 if 里拿不到 secrets 上下文(GitHub 只放
    # github/needs/strategy/matrix/job/runner/env/vars/steps/inputs),写成
    # `secrets.X == ''` 会让整份工作流文件判为非法 —— 不是这条判断失效,而是这一份
    # 从此一次都不跑:每次 push 只留一条 0 秒、零作业的失败记录,连 tag 触发都不认。
    env:
      KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 静态检查 + 单元测试
        run: |
          bun install --frozen-lockfile
          bun run check
          # test:report = 一次完整 vitest 运行 + 分类报告 + 文档例数核对(见 scripts/test-report.mjs)
          bun run test:report
          # 公共库的发布产物自检(见 scripts/engine-dist.mjs)
          bun run check:engine
          bun run check:engine:standalone

      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      # 使用官方 Gradle Action（内置智能缓存）
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 构建前端
        run: bun run build

      - name: 同步 Capacitor
        run: bunx cap sync android

      # 没配 secret 时 gradle 会静默产出「未签名 APK」——那种包手机根本装不上。
      # 与其让 CI 绿着吐一个废包,不如红着把话说明白:下面是硬闸门。
      - name: 校验签名 Secret 已配置
        if: env.KEYSTORE_STORE_PASSWORD == '' || env.KEYSTORE_KEY_PASSWORD == ''
        run: |
          echo "::error::未配置 KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_PASSWORD —— 请在仓库 Settings → Secrets and variables → Actions 添加这两个 secret(值 = android/release.keystore 的原口令)"
          exit 1

      - name: 构建 APK (Release)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  # 3. 发布 Release
  release:
    needs: [guard, ui-check, legacy-artifacts, build-electron, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 获取版本号
        id: get_version
        # tag 即版本(闸门已确认它与 package.json 一致),不再从 package.json 反推 ——
        # 触发这次运行的就是某个 tag,Release 理应挂在那个 tag 上
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # 1. 下载时，不使用 merge-multiple，防止覆盖冲突
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./raw-assets

      # 2. 核心步骤：手动移动文件到一个扁平目录，并强制重命名
      - name: 整理并重命名产物
        run: |
          mkdir -p ./final-release

          # 移动 Electron zip 包
          find ./raw-assets/electron-* -type f -name "*.zip" -exec cp {} ./final-release/ \;

          # 移动 Android APK
          find ./raw-assets/android-apk -type f -name "*.apk" -exec cp {} ./final-release/ \; || true

          # 检查结果
          echo "Final assets to upload:"
          ls -R ./final-release

      # 3. 删除已有 Release 的文件（如果存在）
      - name: 删除已有 Release 资产
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          # 获取 release 的所有资产并删除
          gh release view "$VERSION" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
            echo "Deleting asset: $asset"
            gh release delete-asset "$VERSION" "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 4. 上传新文件
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: ./final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

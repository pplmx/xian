apply plugin: 'com.android.application'

// 从 package.json 读取版本号
def packageJsonFile = file('../../package.json')
def packageJsonText = packageJsonFile.text
// 使用正则提取版本号
def versionMatcher = packageJsonText =~ /"version"\s*:\s*"([^"]+)"/
def appVersionName = versionMatcher ? versionMatcher[0][1] : "1.0.0"
// 版本号转 versionCode:主*10000 + 次*100 + 补丁。
// 项目约定版本号只有两段(如 "1.32"),缺失的段按 0 补,不能直接取下标 —— 否则越界。
def versionParts = appVersionName.split('\\.')
def versionPart = { int i -> i < versionParts.length ? versionParts[i].toInteger() : 0 }
def appVersionCode = versionPart(0) * 10000 + versionPart(1) * 100 + versionPart(2)

// 签名口令:优先走环境变量(CI 由 GitHub Secrets 注入 KEYSTORE_STORE_PASSWORD /
// KEYSTORE_KEY_PASSWORD),回退到 keystore.properties。仓库内的 keystore.properties
// 只存 storeFile/keyAlias,不含口令 —— 口令不入库,克隆者拿不到签名私钥口令。
// 无口令时(本地未设环境变量):不配 release 签名,照常出包(不能安装)但不至于失败。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
// 本地覆盖:不入库的 keystore.local.properties 可补口令与别名(见 android/.gitignore),
// 供本地出包用,避免把口令提交进共享的 keystore.properties。
def localPropsFile = rootProject.file('keystore.local.properties')
def localProps = new Properties()
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
// 口令优先级:环境变量(CI Secrets) > 本地覆盖文件 > 共享属性文件。
def pick = { String key, String envName, props, local ->
    def v = System.getenv(envName)
    if (v != null) return v
    if (local != null && local[key]) return local[key].toString()
    if (props != null && props[key]) return props[key].toString()
    return null
}
// 【这两个局部变量不许叫 storePassword / keyPassword】Groovy 把 `a b` 读成「调用 a 传 b」,
// 而处在作用域里的局部变量优先于闭包 delegate 上的 DSL 方法 —— 一旦同名,
// `storePassword storePassword` 就变成「拿 String 当闭包调」,配置期当场炸:
//   A problem occurred evaluating project ':app'
//   > No signature of method: java.lang.String.call()
// 这几行只在口令齐备时才执行,所以本地不设环境变量时全绿、CI 一注入 Secrets 就红 ——
// 两次发版(v1.34.0 / v1.35.0)都停在这里。取名 storePass / keyPass 就与 DSL 方法错开了。
def storePass = pick('storePassword', 'KEYSTORE_STORE_PASSWORD', keystoreProps, localProps)
def keyPass = pick('keyPassword', 'KEYSTORE_KEY_PASSWORD', keystoreProps, localProps)
// 哨兵:口令齐备才配签名;缺任何一位就直接跳过(出包但未签名)。
// 不希望 CI 在某次构建里悄悄产出「没签名的 release」—— 无口令时显式打日志,一眼可查。
def signingAvailable = storePass != null && storePass.length() > 0 && keyPass != null && keyPass.length() > 0 && keystorePropsFile.exists()
if (!signingAvailable) {
    println "WARNING: 未找到签名口令(KEYSTORE_STORE_PASSWORD/KEYSTORE_KEY_PASSWORD),本次构建产出未签名 APK"
}

android {
    namespace = "com.mystvio.xuanshu"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (signingAvailable) {
                keyAlias keystoreProps['keyAlias']
                keyPassword keyPass
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword storePass
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    defaultConfig {
        applicationId "com.mystvio.xuanshu"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (signingAvailable) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingAvailable) signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "xuanshu-${variant.versionName}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
